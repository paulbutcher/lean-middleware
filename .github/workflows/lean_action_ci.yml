name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5
      # Builds `middleware` and runs its test driver, which in turn runs the `test` package's
      # suite. Neither of those builds `middleware-cookiestore` on its own, so that gets a step
      # of its own below.
      - uses: leanprover/lean-action@v1
      - name: Build middleware-cookiestore
        run: lake build
        working-directory: cookiestore
