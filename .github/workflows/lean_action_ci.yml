name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      # `middleware-tracing` requires `telemetry`, whose OTLP exporter binds to `libcurl` through
      # `leancurl`. Building the libraries never reaches it; the test suite does, via
      # `Telemetry.Testing`, so `leancurl`'s `pkg-config --cflags libcurl` has to succeed on both
      # runners, and neither image supplies everything that needs on its own.
      # `test/leanin` runs the middleware on LeanIn, whose socket shim needs `uv.h` and `-luv`.
      - name: Install libcurl and libuv development files
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libcurl4-openssl-dev libuv1-dev

      - name: Install pkg-config and libuv
        if: runner.os == 'macOS'
        run: |
          pkg-config --version || brew install pkgconf
          brew list libuv || brew install libuv
          echo "CPATH=$(brew --prefix)/include" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"

      # `lake test` builds and links all three packages, so no per-package build step is needed.
      # `test` is set explicitly rather than left to `auto-config`, whose detection of an
      # `@[test_driver]` script (as opposed to a `testDriver` package field) is undocumented; a
      # silent failure to detect it would leave the workflow green while running nothing.
      - uses: leanprover/lean-action@v1
        with:
          test: true
